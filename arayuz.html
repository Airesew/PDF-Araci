<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>PDF Aracı</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div id="app">
  <nav aria-label="İşlemler" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="over"><div id="overTxt">Bırak</div></div>
<div id="busy"><div></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="ind"></div>
<div id="menu" role="menu"></div>
<div id="ghost"></div>
<div id="pv" role="dialog" aria-label="Sayfa önizleme">
  <button class="nb" data-pv="-1" aria-label="Önceki sayfa"></button>
  <div class="stage" id="pvStage"></div>
  <button class="nb" data-pv="1" aria-label="Sonraki sayfa"></button>
  <button class="nb cls" data-pv="0" aria-label="Kapat"></button>
</div>

<script>
"use strict";
/* ------------------------------------------------------------ ikonlar */
const sv = (p, s = 17, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  logo: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  edit: sv('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/>'),
  text: sv('<path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/>'),
  merge: sv('<path d="M6 3v4a6 6 0 0 0 6 6a6 6 0 0 0 6-6V3"/><path d="M12 13v8"/><path d="M9 18l3 3 3-3"/>'),
  split: sv('<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9"/><path d="M14.5 14.5L20 20"/><path d="M8.1 8.1L12 12"/>'),
  comp: sv('<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/>'),
  pjpg: sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 17l2.5-3 2 2 1.5-2 2 3"/>'),
  img: sv('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>'),
  plus: sv('<path d="M5 12h14"/><path d="M12 5v14"/>', 15),
  rot: sv('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', 15),
  out: sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M12 12v6"/><path d="M9 15l3 3 3-3"/>', 15),
  del: sv('<path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>', 15),
  undo: sv('<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>', 15),
  x: sv('<path d="M6 6l12 12"/><path d="M18 6L6 18"/>', 16),
  chk: sv('<path d="M5 12l5 5 9-10"/>', 11, 3.2),
  grip: '<svg width="16" height="16" viewBox="0 0 24 24" fill="#A3A5AD" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  scis: sv('<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9"/><path d="M14.5 14.5L20 20"/><path d="M8.1 8.1L12 12"/>', 14),
  left: sv('<path d="M15 18l-6-6 6-6"/>', 20),
  right: sv('<path d="M9 18l6-6-6-6"/>', 20),
  open: sv('<path d="M14 4h6v6"/><path d="M10 14L20 4"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>', 14),
  lock: sv('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  upload: sv('<path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>', 20, 2.2),
  bulb: sv('<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/>', 18),
  dots: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
  fPdf: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8z" fill="currentColor" opacity=".16"/><path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8zM14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><text x="12" y="17.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.8" font-weight="800" fill="currentColor">PDF</text></svg>',
  fWord: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8z" fill="currentColor" opacity=".16"/><path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8zM14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><text x="12" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="800" fill="currentColor">W</text></svg>',
  pDoc: sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>', 14),
  pImg: sv('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>', 14),
  pLock: sv('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', 14),
  tOk: sv('<path d="M5 12l5 5 9-10"/>', 13, 2.6),
  tErr: sv('<path d="M12 7v6"/><path d="M12 17h.01"/>', 13, 2.6),
  tInfo: sv('<path d="M12 11v6"/><path d="M12 7h.01"/>', 13, 2.6),
  gunes: sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 15),
  ay: sv('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', 15),
  ekranI: sv('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>', 15),
  chev: sv('<path d="M6 9l6 6 6-6"/>', 15),
  arrow: sv('<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', 14),
  addtext: sv('<path d="M4 7V5h11v2"/><path d="M9.5 5v14"/><path d="M7 19h5"/><path d="M18 12v8"/><path d="M14 16h8"/>', 15),
};

/* ------------------------------------------------------------ yardımcılar */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const api = () => window.pywebview.api;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const boyut = b => {
  if (b == null) return "—";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
  return (b / 1048576).toFixed(1).replace(".", ",") + " MB";
};
const kok = ad => ad.replace(/\.[^.]+$/, "");
const dogalSira = (a, b) => a.name.localeCompare(b.name, "tr", { numeric: true, sensitivity: "base" });
let uidSay = 0;
const uid = () => "p" + (++uidSay);
const BOX_W = 148, BOX_H = 192;

function kagitStil(w, h, rot, bw = BOX_W, bh = BOX_H) {
  const r = ((rot % 360) + 360) % 360;
  const ew = r % 180 ? h : w, eh = r % 180 ? w : h;
  const s = Math.min(bw / ew, bh / eh);
  return `width:${(w * s).toFixed(1)}px;height:${(h * s).toFixed(1)}px;transform:translate(-50%,-50%) rotate(${r}deg)`;
}

/* ------------------------------------------------------------ durum */
const yeniIzgara = () => ({ docs: {}, pages: [], sel: new Set(), anchor: null, hist: [], name: "" });
const yeniMetin = () => ({ info: null, sayfa: 0, duzen: {}, hist: [], veri: {}, onz: {}, fontlar: {}, bekle: {}, sira: {}, ekle: false, boyut: 11, aktif: null, kayitli: "{}" });
const S = {
  ekran: "home",
  son: [],
  ed: yeniIzgara(),
  im: Object.assign(yeniIzgara(), { boyut: "a4", kenar: true, kucult: true }),
  tx: yeniMetin(),
  sp: { info: null, cuts: new Set(), n: 2 },
  jp: { info: null, dpi: 150, bicim: "jpg" },
  mg: { files: [], name: "birlesik.pdf", comp: false },
  cm: { info: null, lvl: "orta", est: null, last: null },
  pw: { info: null, last: null, gelen: null },
  wp: { info: null, last: null, gelen: null },
};
const G = () => (S.ekran === "img" ? S.im : S.ed);   // etkin sayfa ızgarası
const T = {};            // "docId:idx" -> küçük resim
const BIG = {};
const yukleniyor = {};

/* ------------------------------------------------------------ meşgul + bildirim */
let mesgul = 0;
async function calis(fn) {
  mesgul++; document.body.classList.add("busy");
  try { return await fn(); }
  catch (e) { bildir(hataMetni(e), "err"); }
  finally { if (--mesgul <= 0) { mesgul = 0; document.body.classList.remove("busy"); } }
}
function hataMetni(e) {
  const m = (e && (e.message || e.toString())) || "Bilinmeyen hata";
  return m.replace(/^Error:\s*/, "");
}
function bildir(msg, tur = "ok", yol = null, eylem = null) {
  const t = document.createElement("div");
  t.className = "toast " + tur;
  t.innerHTML = `<span class="dot">${tur === "err" ? I.tErr : tur === "info" ? I.tInfo : I.tOk}</span><span class="m">${esc(msg)}</span>`;
  const dugme = (etiket, fn) => {
    const b = document.createElement("button");
    b.textContent = etiket;
    b.onclick = () => { fn(); if (eylem && etiket === eylem.etiket) t.remove(); };
    t.appendChild(b);
  };
  if (eylem) dugme(eylem.etiket, eylem.fn);
  if (yol) { dugme("Aç", () => api().ac(yol)); dugme("Klasörde göster", () => api().goster(yol)); }
  $("#toasts").appendChild(t);
  while ($("#toasts").children.length > 3) $("#toasts").firstElementChild.remove();
  setTimeout(() => t.remove(), tur === "err" ? 9000 : (eylem ? 10000 : 7000));
}

/* ------------------------------------------------------------ küçük resimler */
async function resimleriYukle(info, sinir) {
  const n = Math.min(info.pages.length, sinir ?? info.pages.length);
  const mevcut = yukleniyor[info.id] || 0;
  if (mevcut >= n) return;
  yukleniyor[info.id] = n;
  for (let bas = mevcut; bas < n; bas += 8) {
    let urls;
    try { urls = await api().onizlemeler(info.id, bas, Math.min(8, n - bas)); }
    catch (e) { return; }
    urls.forEach((u, k) => {
      const anahtar = info.id + ":" + (bas + k);
      T[anahtar] = u;
      $$(`img[data-t="${anahtar}"]`).forEach(img => { img.src = u; });
    });
  }
}
const resim = (doc, idx, ek = "") => {
  const k = doc + ":" + idx;
  return `<img data-t="${k}" alt="" draggable="false"${ek}${T[k] ? ` src="${T[k]}"` : ""}>`;
};

/* ------------------------------------------------------------ dosya açma + yönlendirme */
async function bilgiTopla(yukleyici, liste) {
  const bilgiler = [];
  await calis(async () => {
    for (const x of liste) {
      try {
        const b = await yukleyici(x);
        if (b) bilgiler.push(b);
      } catch (e) { bildir(hataMetni(e), "err"); }
    }
  });
  return bilgiler;
}
async function yollariAc(yollar) {
  const bilgiler = await bilgiTopla(y => api().yukle(y), yollar);
  if (bilgiler.length) yonlendir(bilgiler);
}

function yonlendir(bilgiler) {
  bilgiler = [...bilgiler].sort(dogalSira);
  const wordler = bilgiler.filter(b => b.word), resimler = bilgiler.filter(b => b.resim);
  const pdfler = bilgiler.filter(b => !b.word && !b.resim), sayfalar = bilgiler.filter(b => !b.word);
  const atla = (n, ne) => n && bildir(`${n} ${ne} bu işlemde kullanılmıyor, atlandı.`, "info");
  switch (S.ekran) {
    case "edit":
    case "img":
      atla(wordler.length, "Word dosyası");
      sayfalar.forEach(b => izgaraEkle(G(), b)); ciz(); return;
    case "merge":
      atla(wordler.length, "Word dosyası");
      if (resimler.length) bildir("Resimleri tek PDF yapmak için JPG → PDF'i kullan.", "info");
      pdfler.forEach(mgEkle); ciz(); return;
    case "split": case "compress": case "text": case "p2w": case "pjpg":
      if (pdfler.length) {
        const b = pdfler[0];
        if (S.ekran === "split") spAyarla(b);
        else if (S.ekran === "compress") cmAyarla(b);
        else if (S.ekran === "pjpg") jpAyarla(b);
        else if (S.ekran === "text") { if (!txAyarla(b)) return; }
        else pwAyarla(b);
        ciz(); return;
      }
      break;
    case "w2p":
      if (wordler.length) { S.wp = { info: wordler[0], last: null, gelen: null }; ciz(); return; }
      break;
  }
  // açılış ekranı ya da uymayan dosya: en uygun ekranı seç
  if (!sayfalar.length) { S.wp = { info: wordler[0], last: null, gelen: null }; git("w2p"); return; }
  atla(wordler.length, "Word dosyası");
  if (!pdfler.length) { imSifirla(); resimler.forEach(b => izgaraEkle(S.im, b)); git("img"); return; }
  if (pdfler.length > 1 && !resimler.length) { pdfler.forEach(mgEkle); git("merge"); return; }
  S.ed = yeniIzgara(); sayfalar.forEach(b => izgaraEkle(S.ed, b)); git("edit");
}

async function sec(tur, coklu) {
  const yollar = await calis(() => api().dosya_sec(tur, coklu));
  if (yollar && yollar.length) await yollariAc(yollar);
}

/* ------------------------------------------------------------ sürükle-bırak (dışarıdan dosya) */
let surukSay = 0;
const disDosyaMi = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files");
function katmanMetni() {
  if (S.ekran === "edit" && S.ed.pages.length) return "Bırak — sayfalar sona eklenecek";
  if (S.ekran === "img" && S.im.pages.length) return "Bırak — resimler sona eklenecek";
  if (S.ekran === "merge") return "Bırak — listeye eklenecek";
  if (S.ekran !== "home") return "Bırak — dosya açılacak";
  return "Bırak, açalım";
}
document.addEventListener("dragenter", e => {
  if (!disDosyaMi(e)) return;
  e.preventDefault(); surukSay++;
  $("#overTxt").textContent = katmanMetni();
  const bosEkran = !!$(".dz") || S.ekran === "merge";
  document.body.classList.add("drag");
  document.body.classList.toggle("overlay", !bosEkran);
});
document.addEventListener("dragover", e => { if (disDosyaMi(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
document.addEventListener("dragleave", e => {
  if (!disDosyaMi(e)) return;
  if (--surukSay <= 0) { surukSay = 0; document.body.classList.remove("drag", "overlay"); }
});
document.addEventListener("drop", async e => {
  if (!disDosyaMi(e)) return;
  e.preventDefault(); surukSay = 0;
  document.body.classList.remove("drag", "overlay");
  kabulOynat();
  if (window.__pyBirakma) return; // Python tam yolları gönderecek
  const bilgiler = await bilgiTopla(async f => {
    const b64 = await new Promise((ok, no) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || "");
      r.onerror = no; r.readAsDataURL(f);
    });
    return api().yukle_veri(f.name, b64);
  }, [...e.dataTransfer.files]);
  if (bilgiler.length) yonlendir(bilgiler);
});
window.__dosyaBirakildi = yollar => yollariAc(yollar);

/* ------------------------------------------------------------ menü */
const MENU = [
  ["edit", "Sayfa düzenle", I.edit], ["text", "Metin düzenle", I.text], ["merge", "Birleştir", I.merge],
  ["split", "Ayır", I.split], ["compress", "Küçült", I.comp],
  null,
  ["img", "JPG → PDF", I.img], ["pjpg", "PDF → JPG", I.pjpg], ["p2w", "PDF → Word", '<span class="lt">W</span>'], ["w2p", "Word → PDF", '<span class="lt">P</span>'],
];
function menuCiz() {
  $("#nav").innerHTML =
    `<button class="logo" data-go="home"><i>${I.logo}</i>PDF Aracı</button>` +
    MENU.map(m => m ? `<button class="nv${S.ekran === m[0] ? " on" : ""}" data-go="${m[0]}">${m[2]}${m[1]}</button>` : '<div class="sep"></div>').join("") +
    `<div class="navnote" style="margin-bottom:10px">${I.bulb}<span>Dosyayı pencerenin herhangi bir yerine bırakabilirsin.</span></div>` +
    `<div class="tema"><span>Tema</span><div class="seg" role="radiogroup" aria-label="Tema">${TEMALAR.map(([k, ad, ic]) =>
      `<button class="${tema === k ? "on" : ""}" data-tema-sec="${k}" title="${ad}" aria-label="${ad} tema" aria-pressed="${tema === k}">${ic}</button>`).join("")}</div></div>`;
}
$("#nav").addEventListener("click", e => {
  const t = e.target.closest("[data-tema-sec]");
  if (t) { temaUygula(t.dataset.temaSec, true); return; }
  const b = e.target.closest("[data-go]"); if (b) git(b.dataset.go);
});

/* ------------------------------------------------------------ tema: açık / koyu / Windows'a uy */
const TEMALAR = [["acik", "Açık", I.gunes], ["koyu", "Koyu", I.ay], ["sistem", "Windows'a uy", I.ekranI]];
let tema = "sistem";
const koyuMedya = matchMedia("(prefers-color-scheme: dark)");
const koyuMu = () => tema === "koyu" || (tema === "sistem" && koyuMedya.matches);
function temaUygula(t, kaydet) {
  tema = TEMALAR.some(x => x[0] === t) ? t : "sistem";
  document.documentElement.dataset.tema = tema;
  try {
    if (window.pywebview && window.pywebview.api) {
      Promise.resolve(api().baslik_tema(koyuMu())).catch(() => {});
      if (kaydet) Promise.resolve(api().ayar_yaz({ tema })).catch(() => {});
    }
  } catch (e) { /* başlık rengi isteğe bağlı */ }
  menuCiz();
}
koyuMedya.addEventListener("change", () => { if (tema === "sistem") temaUygula("sistem", false); });
function git(ekran) {
  txGirdiKapat(true);
  S.ekran = ekran; ciz(true);
  if (ekran === "home" && window.pywebview && window.pywebview.api) {
    api().son_dosyalar().then(l => { S.son = l; if (S.ekran === "home") ciz(true); }).catch(() => {});
  }
}

/* ------------------------------------------------------------ çizim */
const EKRAN = { pjpg: jpEkrani, home: evEkrani, edit: edEkrani, img: imEkrani, text: txEkrani, split: spEkrani, merge: mgEkrani, compress: cmEkrani, p2w: pwEkrani, w2p: wpEkrani };
function ciz(sifirla) {
  menuCiz();
  const kaydir = {};
  if (!sifirla) $$("[data-kaydir]").forEach(el => { kaydir[el.id] = el.scrollTop; });
  const girdi = txGirdiSakla();
  $("#main").innerHTML = EKRAN[S.ekran]();
  $$("[data-kaydir]").forEach(el => { if (kaydir[el.id] != null) el.scrollTop = kaydir[el.id]; });
  if (girdi && S.ekran === "text") txGirdiAc(girdi.h, girdi.deger, girdi.secim);
  kayitDurumu();
}
/* Yalnızca seçim değiştiğinde: bütün sayfaları yeniden çizmek yerine kartların işaretini ve alt çubuğu güncelle
   (yüzlerce sayfalık PDF'te her tıklamada tüm resimler yeniden yüklenmesin) */
function secimCiz() {
  const secili = new Set();
  [S.ed, S.im, S.sp, S.jp, S.cm, S.pw, ...S.mg.files].forEach(g => g && g.sel && g.sel.forEach(k => secili.add(k)));
  $$("#main .pg[data-key]").forEach(el => {
    const sel = secili.has(el.dataset.key);
    if (el.classList.contains("sel") === sel) return;
    el.classList.toggle("sel", sel);
    const num = el.querySelector(".num");
    num.innerHTML = (sel ? I.chk : "") + esc(num.textContent);

function onceYaz(t) {
  if (!t) return "";
  const s = Date.now() / 1000 - t;
  if (s < 60) return "az önce";
  if (s < 3600) return Math.floor(s / 60) + " dakika önce";
  if (s < 86400) return Math.floor(s / 3600) + " saat önce";
  const g = Math.floor(s / 86400);
  if (g === 1) return "dün";
  if (g < 7) return g + " gün önce";
  if (g < 30) return Math.floor(g / 7) + " hafta önce";
  return new Date(t * 1000).toLocaleDateString("tr-TR");
}

/* ---- tek belgede sayfa seçme/silme: Ayır, PDF → JPG, Küçült, PDF → Word */
const yeniBelge = info => ({ info, pages: info.pages.map((_, i) => ({ key: uid(), doc: info.id, idx: i, rot: 0 })), sel: new Set(), anchor: null, hist: [] });
const BELGE = { split: () => S.sp, pjpg: () => S.jp, compress: () => S.cm, p2w: () => S.pw };
const BELGE_ATA = { split: v => { S.sp = v; }, pjpg: v => { S.jp = v; }, compress: v => { S.cm = v; }, p2w: v => { S.pw = v; } };
const BELGE_BOS = {

  compress: () => ({ info: null, lvl: S.cm.lvl, est: null, last: null }), p2w: () => ({ info: null, last: null, gelen: null }),
};
const aktifBelge = () => { const f = BELGE[S.ekran]; const st = f && f(); return st && st.info && st.pages ? st : null; };
const belgeDegisti = st => st.pages.length !== st.info.pages.length;
function bgKayit(st) {
  st.hist.push({ pages: st.pages.map(p => ({ ...p })), cuts: st.cuts ? new Set(st.cuts) : null });

}
function bgSonra(st) { if (st === S.cm) cmTahmin(); }
function bgGeriAl(st = aktifBelge()) {

  const h = st.hist.pop();
  st.pages = h.pages; if (h.cuts) st.cuts = h.cuts;
  const var_ = new Set(st.pages.map(p => p.key));
  st.sel = new Set([...st.sel].filter(k => var_.has(k)));
  bgSonra(st); ciz();
}
function bgSecTikla(st, key, e) {
  const sira = st.pages.map(p => p.key);
  if (e && e.shiftKey && st.anchor && sira.includes(st.anchor)) {
    const a = sira.indexOf(st.anchor), b = sira.indexOf(key);
    sira.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(k => st.sel.add(k));
  } else {
    st.sel.has(key) ? st.sel.delete(key) : st.sel.add(key);
    st.anchor = key;
  }

}
function bgSil(st, keys) {
  if (!st || !keys.size) return;
  if (keys.size >= st.pages.length) {
    const ekran = S.ekran;
    const yedek = { ...st, pages: st.pages.map(p => ({ ...p })), sel: new Set(), cuts: st.cuts ? new Set(st.cuts) : undefined };
    BELGE_ATA[ekran](BELGE_BOS[ekran]()); ciz();
    bildir("Tüm sayfalar silindi, belge kapatıldı.", "info", null, {
      etiket: "Geri al", fn: () => { BELGE_ATA[ekran](yedek); S.ekran = ekran; bgSonra(yedek); ciz(true); },
    });

  }
  bgKayit(st);
  st.pages = st.pages.filter(p => !keys.has(p.key));

/* ---- ayır */
function spAyarla(info) { S.sp = { ...yeniBelge(info), cuts: new Set(), n: S.sp.n || 2 }; resimleriYukle(info); }

  else alt = `<div class="hint"><b>Sayfalara tıkla</b>, seçtiklerini ayrı PDF yap · <b>iki sayfanın arasına</b> tıkla, böl · üstüne gelip <b>sil</b></div>`;
  return `<header class="hdr">
      <div class="ttl"><b>${esc(sp.info.name)}</b><span class="mono">${sayfaSayisi(sp)} · ${boyut(sp.info.size)}</span></div>
      <div class="tools">

}

/* ------------------------------------------------------------ metin düzenle */
const dz = i => (S.tx.duzen[i] ||= { mod: {}, add: [] });
const bosDuzen = d => !d || (!Object.keys(d.mod).length && !d.add.length);
const degisiklikSayisi = () => Object.values(S.tx.duzen).reduce((a, d) => a + Object.keys(d.mod).length + d.add.length, 0);
const kaydedilmemis = () => degisiklikSayisi() > 0 && JSON.stringify(txTemizDuzen()) !== S.tx.kayitli;
function txTemizDuzen() {
  const o = {};
  Object.entries(S.tx.duzen).forEach(([i, d]) => { if (!bosDuzen(d)) o[i] = d; });
  return o;
}
function txAyarla(info) {
  if (kaydedilmemis() && !confirm("Metin düzenlemedeki kaydedilmemiş değişiklikler silinecek. Devam edilsin mi?")) return false;
  txGirdiKapat(false);
  S.tx = yeniMetin();
  S.tx.info = info;
  resimleriYukle(info);
  txSayfaYukle(0);
  if (info.pages.length > 1) txSayfaYukle(1);
  return true;
}
function txSayfaYukle(i) {
  const tx = S.tx, id = tx.info.id;
  if (tx.veri[i] || tx.veri[i] === null) return;
  tx.veri[i] = null; // yükleniyor
  api().metin_sayfa(id, i, 1600).then(v => {
    if (S.tx.info && S.tx.info.id === id) { S.tx.veri[i] = v; if (S.ekran === "text" && S.tx.sayfa === i) ciz(); }
  }).catch(e => { if (S.tx.info && S.tx.info.id === id) delete S.tx.veri[i]; bildir(hataMetni(e), "err"); });
}
function txOnizle(i) {
  const tx = S.tx, id = tx.info.id, d = tx.duzen[i];
  if (bosDuzen(d)) { delete tx.onz[i]; delete tx.fontlar[i]; tx.bekle[i] = false; return; }
  const no = (tx.sira[i] || 0) + 1;
  tx.sira[i] = no; tx.bekle[i] = true;
  api().metin_onizle(id, i, d, 1600).then(r => {
    if (!S.tx.info || S.tx.info.id !== id || S.tx.sira[i] !== no) return;
    S.tx.onz[i] = r.img; S.tx.fontlar[i] = r.fontlar || {}; S.tx.bekle[i] = false;
    if (S.ekran === "text" && S.tx.sayfa === i) ciz();
  }).catch(e => {
    if (S.tx.sira[i] !== no) return;
    S.tx.bekle[i] = false; bildir(hataMetni(e), "err"); if (S.ekran === "text") ciz();
  });
}
function txGit(i) {
  const n = S.tx.info.pages.length;
  if (i < 0 || i >= n || i === S.tx.sayfa) return;
  txGirdiKapat(true);
  S.tx.sayfa = i;
  txSayfaYukle(i);
  if (i + 1 < n) txSayfaYukle(i + 1);
  if (!bosDuzen(S.tx.duzen[i]) && !S.tx.onz[i] && !S.tx.bekle[i]) txOnizle(i);
  ciz();
  const th = $(`.txth[data-i="${i}"]`);
  if (th) th.scrollIntoView({ block: "nearest" });
  const m = $("#txMain"); if (m) m.scrollTop = 0;
}
function txKayit() {
  S.tx.hist.push(JSON.stringify(S.tx.duzen));
  if (S.tx.hist.length > 60) S.tx.hist.shift();
}
function txGeriAl() {
  const tx = S.tx;
  if (!tx.hist.length) return;
  txGirdiKapat(false);
  const eski = tx.duzen;
  tx.duzen = JSON.parse(tx.hist.pop());
  const sayfalar = new Set([...Object.keys(eski), ...Object.keys(tx.duzen)]);
  sayfalar.forEach(i => {
    if (JSON.stringify(eski[i] || null) !== JSON.stringify(tx.duzen[i] || null)) {
      delete tx.onz[i];
      if (+i === tx.sayfa) txOnizle(+i);
    }
  });
  ciz();
}
function txGenislik() {
  const m = $("#main");
  const avail = (m ? m.clientWidth : 1000) - 132 - 64;
  return Math.max(420, Math.min(avail, 980));
}
function famCss(l) {
  const ad = (l.font || "").replace(/^[A-Z]{6}\+/, "").split(/[-,]/)[0].replace(/(PS)?MT$/, "").replace(/PS$/, "").replace(/([a-z])([A-Z])/g, "$1 $2");
  const yedek = l.mono ? '"Courier New", monospace' : l.serif ? '"Times New Roman", serif' : "Arial, sans-serif";
  return `"${ad}", ${yedek}`;
}
const olcCanvas = document.createElement("canvas").getContext("2d");
function olc(metin, px, fam, kalin, egik) {
  olcCanvas.font = `${egik ? "italic " : ""}${kalin ? "700" : "400"} ${px}px ${fam}`;
  return olcCanvas.measureText(metin || "").width;
}
function txEkrani() {
  const tx = S.tx;
  if (!tx.info) return bosAlan("Metnini düzenleyeceğin PDF'i bırak", "Yazının üstüne tıkla, değiştir. Bilgisayarında aynı yazı tipi varsa onunla yazılır, böylece fark edilmez.", "pdf", false, ".pdf");
  const i = tx.sayfa, info = tx.info, n = info.pages.length, v = tx.veri[i];
  const sayi = degisiklikSayisi();
  const kenar = info.pages.map((pg, k) => `<button class="txth${k === i ? " on" : ""}" data-act="txGit" data-i="${k}" aria-label="Sayfa ${k + 1}">
      <span class="pp"><span class="paper" style="${kagitStil(pg.w, pg.h, 0, 96, 124)}">${resim(info.id, k)}</span></span>
      <span class="n">${k + 1}${bosDuzen(tx.duzen[k]) ? "" : '<span class="dot"></span>'}</span></button>`).join("");
  const W = txGenislik();
  let sayfaHTML, uyari = "";
  if (!v) {
    const pg = info.pages[i], s = W / pg.w;
    const k = info.id + ":" + i;
    sayfaHTML = `<div class="txpage" style="width:${W}px;height:${(pg.h * s).toFixed(1)}px">${T[k] ? `<img src="${T[k]}" alt="">` : ""}<div class="yuk">Sayfa hazırlanıyor…</div></div>`;
  } else {
    const s = W / v.w, d = tx.duzen[i] || { mod: {}, add: [] }, bek = tx.bekle[i];
    if (v.donuk) uyari = "Bu sayfa döndürülmüş. Döndürülmüş sayfalarda metin düzenleme çalışmıyor; önce Sayfa düzenle'de düz çevirip kaydedebilirsin.";
    else if (!v.satirlar.length) uyari = "Bu sayfada seçilebilir yazı yok; büyük ihtimalle taranmış bir belge. Yine de üstteki <b>Metin ekle</b> ile yeni yazı ekleyebilirsin.";
    const satir = v.satirlar.map(l => {
      const ed = l.key in d.mod;
      const metin = ed ? d.mod[l.key] : l.text;
      const [x0, y0, x1, y1] = l.bbox;
      const gor = ed && bek ? `<span style="font:${l.italic ? "italic " : ""}${l.bold ? 700 : 400} ${(l.size * s).toFixed(2)}px ${esc(famCss(l))};color:${l.color}">${esc(metin)}</span>` : "";
      const gen = ed ? Math.max((x1 - x0) * s, olc(metin, l.size * s, famCss(l), l.bold, l.italic)) : (x1 - x0) * s;
      return `<div class="ln${ed ? " ed" : ""}${ed && bek ? " pend" : ""}" data-k="${l.key}" style="left:${(x0 * s - 2).toFixed(1)}px;top:${(y0 * s - 1).toFixed(1)}px;width:${(gen + 4).toFixed(1)}px;height:${((y1 - y0) * s + 2).toFixed(1)}px">${gor}</div>`;
    }).join("");
    const ekler = d.add.map((a, j) => {
      const px = a.size * s, gen = olc(a.text, px, "Arial, sans-serif") + 6;
      return `<div class="ln ed${bek ? " pend" : ""}" data-a="${j}" style="left:${(a.x * s - 3).toFixed(1)}px;top:${((a.y - a.size * 0.92) * s).toFixed(1)}px;width:${gen.toFixed(1)}px;height:${(a.size * 1.2 * s).toFixed(1)}px">${bek ? `<span style="font:400 ${px.toFixed(2)}px Arial, sans-serif;color:#000">${esc(a.text)}</span>` : ""}</div>`;
    }).join("");
    sayfaHTML = `<div class="txpage${tx.ekle ? " ekle" : ""}" id="txPage" style="width:${W}px;height:${(v.h * s).toFixed(1)}px" data-s="${s}">
      <img src="${tx.onz[i] || v.img}" alt="" draggable="false">${v.donuk ? "" : satir + ekler}</div>`;
  }
  return `<header class="hdr">
      <div class="ttl"><b>${esc(info.name)}</b><span class="mono">Sayfa ${i + 1} / ${n}${sayi ? ` · ${sayi} değişiklik` : ""}</span></div>
      ${tx.ekle ? `<label class="sz">Boyut <input id="txBoyut" type="number" min="4" max="96" value="${tx.boyut}"></label>` : ""}
      <button class="btn${tx.ekle ? " on" : ""}" data-act="txEkle" aria-pressed="${tx.ekle}" title="Boş bir yere tıklayıp yeni yazı ekle">${I.addtext}Metin ekle</button>
      <button class="btn" data-act="txGeriAl"${tx.hist.length ? "" : " disabled"} title="Geri al (Ctrl Z)">${I.undo}Geri al</button>
      <button class="btn" data-act="txKapat">Kapat</button>
      <button class="btn dark primary" data-act="txKaydet">Kaydet <span class="k">Ctrl S</span></button>
    </header>
    <div class="txwrap">
      <aside class="txside" id="txSide" data-kaydir aria-label="Sayfalar">${kenar}</aside>
      <section class="txmain" id="txMain" data-kaydir>${uyari ? `<div class="banner">${uyari}</div>` : ""}${sayfaHTML}</section>
    </div>
    <div class="barwrap"><div class="hint">${tx.ekle ? "<b>Boş bir yere tıkla</b> ve yaz · Enter onayla · Esc vazgeç" : "<b>Yazıya tıkla</b> ve değiştir · Enter onayla · Esc vazgeç · silmek için metni boşalt"}</div></div>`;
}

/* düzenleme kutusu */
function txHedef(h) {
  const v = S.tx.veri[S.tx.sayfa];
  if (!v) return null;
  const d = dz(S.tx.sayfa);
  if (h.tur === "mod") {
    const l = v.satirlar.find(x => x.key === h.key);
    if (!l) return null;
    return { l, metin: h.key in d.mod ? d.mod[h.key] : l.text, x: l.bbox[0], y0: l.bbox[1], y1: l.bbox[3], size: l.size, fam: famCss(l), bold: l.bold, italic: l.italic, color: l.color };
  }
  const a = h.tur === "add" ? d.add[h.j] : { x: h.x, y: h.y, text: "", size: S.tx.boyut };
  if (!a) return null;
  return { metin: a.text, x: a.x, y0: a.y - a.size * 0.92, y1: a.y + a.size * 0.28, size: a.size, fam: "Arial, sans-serif", bold: false, italic: false, color: "#000000" };
}
function chipHTML(h, t) {
  const i = S.tx.sayfa;
  if (h.tur !== "mod") return `<i class="yedek"></i><div>Arial · ${Math.round(t.size)} pt <span>· yeni yazı</span></div>`;
  const l = t.l, son = (S.tx.fontlar[i] || {})[h.key];
  const tur = son ? son.tur : l.fontTur, ad = son ? son.ad : l.fontAd;
  const pt = `${Math.round(l.size * 10) / 10} pt`;
  if (tur === "sistem") return `<i></i><div>${esc(ad)} · ${pt} <span>· bilgisayarında var, aynı yazı tipiyle yazılır</span></div>`;
  if (tur === "gomulu") return `<i class="gomulu"></i><div>${esc(ad)} · ${pt} <span>· PDF'in kendi yazı tipi. Belgede hiç geçmeyen bir harf yazarsan ${esc(l.fontYedek || "Arial")} kullanılır.</span></div>`;
  return `<i class="yedek"></i><div>${esc(ad)} · ${pt} <span>· ${esc(l.font)} bilgisayarında yok, en yakın yazı tipi kullanılacak</span></div>`;
}
function txGirdiAc(h, deger, secim) {
  const sayfa = $("#txPage");
  if (!sayfa) return;
  const t = txHedef(h);
  if (!t) return;
  const s = +sayfa.dataset.s;
  const inp = document.createElement("input");
  inp.className = "txin";
  inp.value = deger ?? t.metin;
  const px = t.size * s, yuk = Math.max((t.y1 - t.y0) * s, px * 1.15);
  const ayarla = () => {
    const w = Math.max(olc(inp.value, px, t.fam, t.bold, t.italic) + 14, h.tur === "mod" ? (t.l.bbox[2] - t.l.bbox[0]) * s + 8 : 60);
    inp.style.width = w + "px";
  };
  Object.assign(inp.style, {
    left: (t.x * s - 3) + "px", top: (t.y0 * s - 1) + "px", height: (yuk + 2) + "px", lineHeight: (yuk + 2) + "px",
    font: `${t.italic ? "italic " : ""}${t.bold ? 700 : 400} ${px}px ${t.fam}`, color: t.color,
  });
  ayarla();
  inp.addEventListener("input", ayarla);
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); txOnayla(); }
    else if (e.key === "Escape") { e.preventDefault(); txGirdiKapat(false); }
    e.stopPropagation();
  });
  inp.addEventListener("blur", () => { if (S.tx.aktif && S.tx.aktif.inp === inp) txOnayla(false); });
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.innerHTML = chipHTML(h, t);
  chip.style.left = Math.max(0, t.x * s - 3) + "px";
  chip.style.top = (t.y0 * s + yuk + 10) + "px";
  sayfa.appendChild(inp); sayfa.appendChild(chip);
  S.tx.aktif = { h, inp, chip };
  inp.focus();
  if (secim) inp.setSelectionRange(secim[0], secim[1]); else inp.select();
}
function txGirdiSakla() {
  const a = S.tx.aktif;
  if (!a || !a.inp.isConnected) return null;
  S.tx.aktif = null; // yeniden çizim sırasında 'blur' onaylamasın
  return { h: a.h, deger: a.inp.value, secim: [a.inp.selectionStart, a.inp.selectionEnd] };
}
function txGirdiKapat(onayla) {
  const a = S.tx.aktif;
  if (!a) return;
  if (onayla) { txOnayla(false); return; }
  S.tx.aktif = null;
  a.inp.remove(); a.chip.remove();
}
function txOnayla(cizilsin = true) {
  const a = S.tx.aktif;
  if (!a) return;
  S.tx.aktif = null;
  const deger = a.inp.value, h = a.h, i = S.tx.sayfa, d = dz(i);
  a.inp.remove(); a.chip.remove();
  let degisti = false;
  if (h.tur === "mod") {
    const l = S.tx.veri[i].satirlar.find(x => x.key === h.key);
    const simdiki = h.key in d.mod ? d.mod[h.key] : l.text;
    if (deger !== simdiki) {
      txKayit();
      if (deger === l.text) delete d.mod[h.key]; else d.mod[h.key] = deger;
      degisti = true;
    }
  } else if (h.tur === "add") {
    if (deger !== d.add[h.j].text) {
      txKayit();
      if (deger.trim()) d.add[h.j].text = deger; else d.add.splice(h.j, 1);
      degisti = true;
    }
  } else if (deger.trim()) {
    txKayit();
    d.add.push({ x: +h.x.toFixed(2), y: +h.y.toFixed(2), text: deger, size: S.tx.boyut });
    degisti = true;
  }
  if (degisti) txOnizle(i);
  if (cizilsin) ciz(); else kayitDurumu();
}
async function txKaydet() {
  txGirdiKapat(true);
  const tx = S.tx, duz = txTemizDuzen();
  if (!Object.keys(duz).length) { bildir("Henüz bir değişiklik yapmadın.", "info"); return; }
  const r = await calis(() => api().metin_kaydet(tx.info.id, duz, kok(tx.info.name) + "_duzenli.pdf"));
  if (r) { tx.kayitli = JSON.stringify(duz); kayitDurumu(); bildir(`Kaydedildi: ${r.name}`, "ok", r.path); }
}
/* metin sayfasında tıklamalar: blur sırasından etkilenmemek için mousedown kullanılıyor */
$("#main").addEventListener("mousedown", e => {
  if (S.ekran !== "text" || e.button !== 0) return;
  const sayfa = e.target.closest("#txPage");
  if (!sayfa || e.target.classList.contains("txin")) return;
  const v = S.tx.veri[S.tx.sayfa];
  if (!v || v.donuk) return;
  const ln = e.target.closest(".ln");
  let h = null;
  if (ln && ln.dataset.k) h = { tur: "mod", key: ln.dataset.k };
  else if (ln && ln.dataset.a != null) h = { tur: "add", j: +ln.dataset.a };
  else if (S.tx.ekle) {
    const r = sayfa.getBoundingClientRect(), s = +sayfa.dataset.s;
    h = { tur: "yeni", x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s + S.tx.boyut * 0.35 };
  }
  if (!h) { if (S.tx.aktif) { e.preventDefault(); txOnayla(); } return; }
  e.preventDefault();
  if (S.tx.aktif) txOnayla(false);
  ciz();
  txGirdiAc(h);
});

const azHareket = matchMedia("(prefers-reduced-motion: reduce)");
let egimKare = 0, egimSon = null;
$("#main").addEventListener("mousemove", e => {
  if (azHareket.matches || S.ekran !== "home") return;
  egimSon = e;
  if (egimKare) return;
  egimKare = requestAnimationFrame(() => {
    egimKare = 0;
    const t = $(".hero:not(.mini) .tilt");
    if (!t || !egimSon) return;
    const r = t.parentElement.getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, (egimSon.clientX - (r.left + r.width / 2)) / (r.width / 2 + 240)));
    const ny = Math.max(-1, Math.min(1, (egimSon.clientY - (r.top + r.height / 2)) / (r.height / 2 + 240)));
    t.style.setProperty("--ry", (nx * 6).toFixed(2) + "deg");
    t.style.setProperty("--rx", (-ny * 4.5).toFixed(2) + "deg");
    t.style.setProperty("--mx", nx.toFixed(3));
    t.style.setProperty("--my", ny.toFixed(3));
  });
});
$("#main").addEventListener("mouseleave", () => {
  const t = $(".hero .tilt");
  if (t) ["--rx", "--ry", "--mx", "--my"].forEach(v => t.style.removeProperty(v));
});

  },
  // dönüştür
  cmKapat: () => { S.cm = BELGE_BOS.compress(); ciz(); },
  pwKapat: () => { S.pw = { info: null, last: null, gelen: null }; ciz(); },
  wpKapat: () => { S.wp = { info: null, last: null, gelen: null }; ciz(); },
  pwDegistir: () => sec("pdf", false),
  wpDegistir: () => sec("word", false),
  pw: async () => {
    const d = S.pw, liste = d.pages && belgeDegisti(d) ? d.pages.map(p => p.idx) : null;
    const r = await calis(() => api().pdf_word(d.info.path, liste));
    if (!r) return;
    S.pw.last = r;
    S.wp = { info: { word: true, path: r.path, name: r.name, size: r.size }, last: null, gelen: "PDF → Word'den geldi" };
    ciz(); bildir(`Word dosyası hazır: ${r.name}`, "ok", r.path);
  },
  pwGec: () => git("w2p"),
  wp: async () => {
    const r = await calis(() => api().word_pdf(S.wp.info.path));
    if (!r) return;
    S.wp.last = r;
    S.pw = { info: { path: r.path, name: r.name, size: r.size }, last: null, gelen: "Word → PDF'den geldi" };
    api().yukle(r.path).then(b => {
      if (b && S.pw.info && S.pw.info.path === b.path) { pwAyarla(b, "Word → PDF'den geldi"); if (S.ekran === "p2w") ciz(); }
    }).catch(() => {});
    ciz(); bildir(`PDF hazır: ${r.name}`, "ok", r.path);
  },
  wpDuzenle: () => {
    if (S.ed.pages.length && confirm("Sayfa düzenle'de açık bir belge var. Onu kapatıp bu PDF'i açayım mı?\n(İptal dersen sayfalar mevcut belgenin sonuna eklenir.)")) S.ed = yeniIzgara();
    S.ekran = "edit"; yollariAc([S.wp.last.path]);
  },
};
$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const f = EYLEM[b.dataset.act];
  if (f) f(b, e);
});
$("#main").addEventListener("change", e => {
  const t = e.target;
  if (t.id === "mgKucult") S.mg.comp = t.checked;
  if (t.id === "mgAd") S.mg.name = t.value;
  if (t.id === "imKenar") { S.im.kenar = t.checked; ciz(); }
  if (t.id === "imKucult") S.im.kucult = t.checked;
  if (t.id === "txBoyut") S.tx.boyut = Math.max(4, Math.min(96, +t.value || 11));
});
$("#main").addEventListener("keydown", e => {
  if (e.target.id === "spN" && e.key === "Enter") EYLEM.herN();
});

/* ------------------------------------------------------------ sayfa seçimi + sürükleyerek sıralama */
const ind = $("#ind"), ghost = $("#ghost");
let basili = null, surukleme = null, sonTik = {};
const izgaraEkrani = () => (S.ekran === "edit" || S.ekran === "img") && $("#grid");

function secimTikla(key, e, g = G()) {
  const sira = g.pages.map(p => p.key);
  if (e.ctrlKey || e.metaKey) {
    g.sel.has(key) ? g.sel.delete(key) : g.sel.add(key);
    g.anchor = key;
  } else if (e.shiftKey && g.anchor && sira.includes(g.anchor)) {
    const a = sira.indexOf(g.anchor), b = sira.indexOf(key);
    g.sel = new Set(sira.slice(Math.min(a, b), Math.max(a, b) + 1));
  } else {
    g.sel.has(key) ? g.sel.delete(key) : g.sel.add(key);
    g.anchor = key;
  }
  secimCiz();
}

$("#main").addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  if (izgaraEkrani()) {
    if (e.target.closest("button")) return;
    const k = e.target.closest(".pg");
    if (!k) {
      if (e.target.closest(".scroll") && G().sel.size) { G().sel.clear(); secimCiz(); }
      return;
    }
    basili = { tur: "sayfa", key: k.dataset.key, x: e.clientX, y: e.clientY, e, ctx: baglam(k) };
  } else if (S.ekran === "merge") {
    if (e.target.closest("button")) return;
    const serit = e.target.closest(".mstrip");
    if (serit) {
      const ctx = baglam(serit);
      const k = e.target.closest(".pg");
      if (S.mg.odak !== ctx.g.k) { const eski = aktifG(); if (eski) eski.sel.clear(); S.mg.odak = ctx.g.k; }
      if (!k) { if (ctx.g.sel.size) { ctx.g.sel.clear(); secimCiz(); } return; }
      basili = { tur: "sayfa", key: k.dataset.key, x: e.clientX, y: e.clientY, e, ctx };
      return;
    }
    const satir = e.target.closest(".mrow");
    if (!satir) return;
    basili = { tur: "satir", key: satir.closest(".mitem").dataset.k, x: e.clientX, y: e.clientY, e };
  }
});

window.addEventListener("pointermove", e => {
  if (!basili) return;
  if (!surukleme) {
    if (Math.hypot(e.clientX - basili.x, e.clientY - basili.y) < 6) return;
    basili.tur === "sayfa" ? sayfaSurukBasla() : satirSurukBasla();
  }
  surukleme.tur === "sayfa" ? sayfaSurukHareket(e) : satirSurukHareket(e);
});

window.addEventListener("pointerup", () => {
  if (!basili) return;
  const b = basili; basili = null;
  if (!surukleme) {
    if (b.tur !== "sayfa") return;
    const simdi = Date.now();
    if (sonTik.key === b.key && simdi - sonTik.t < 380) {
      sonTik = {};
      onizlemeAc(b.ctx.g.pages.findIndex(p => p.key === b.key), b.ctx.g);
      return;
    }
    sonTik = { key: b.key, t: simdi };
    secimTikla(b.key, b.e, b.ctx.g);
    return;
  }
  const s = surukleme; surukleme = null;
  ind.style.display = "none"; ghost.style.display = "none";
  document.body.classList.remove("body-dragging");
  clearInterval(s.oto);
  s.tur === "sayfa" ? sayfaBirak(s) : satirBirak(s);
});

function sayfaSurukBasla() {
  const { g, kap, sc } = basili.ctx;
  const seciliydi = g.sel.has(basili.key);
  if (!seciliydi) g.sel = new Set([basili.key]);
  const keys = g.pages.filter(p => g.sel.has(p.key)).map(p => p.key);
  ciz();
  $$(".pg", $(kap)).forEach(k => k.classList.toggle("dragging", g.sel.has(k.dataset.key)));
  const ilk = $(`.pg[data-key="${basili.key}"] .paper`);
  const r = ilk.getBoundingClientRect();
  const img = ilk.querySelector("img");
  const w = Math.min(r.width, 120), h = w * (r.height / r.width);
  ghost.innerHTML = (img && img.src ? `<img src="${img.src}" style="width:${w}px;height:${h}px;object-fit:contain">` : `<div style="width:${w}px;height:${h}px"></div>`) +
    (keys.length > 1 ? `<i>${keys.length}</i>` : "");
  ghost.style.display = "block";
  document.body.classList.add("body-dragging");
  surukleme = { tur: "sayfa", keys, hedef: null, w, h, sc: $(sc), vy: 0, g, kap, temizle: !seciliydi };
  surukleme.oto = setInterval(() => { if (surukleme && surukleme.vy) surukleme.sc.scrollTop += surukleme.vy; }, 16);
}

function sayfaSurukHareket(e) {
  const s = surukleme;
  ghost.style.left = (e.clientX - s.w / 2) + "px";
  ghost.style.top = (e.clientY - s.h / 2) + "px";
  const sr = s.sc.getBoundingClientRect();
  s.vy = e.clientY < sr.top + 60 ? -12 : e.clientY > sr.bottom - 60 ? 12 : 0;
  const kalan = $$(".pg", $(s.kap)).filter(k => !s.keys.includes(k.dataset.key));
  let idx = 0;
  for (const k of kalan) {
    const r = k.getBoundingClientRect();
    if (e.clientY > r.bottom + 13) idx++;
    else if (e.clientY >= r.top - 13 && e.clientX > r.left + r.width / 2) idx++;
  }
  s.hedef = idx;
  if (!kalan.length) { ind.style.display = "none"; return; }
  const ref = kalan[Math.min(idx, kalan.length - 1)].querySelector(".box").getBoundingClientRect();
  const ara = s.kap === "#grid" ? 14 : 12;
  const x = idx < kalan.length ? ref.left - ara : ref.right + ara - 3;
  Object.assign(ind.style, { display: "block", left: x + "px", top: ref.top + "px", height: ref.height + "px", width: "3px" });
}

function sayfaBirak(s) {
  const g = s.g;
  if (s.temizle) g.sel.clear(); // seçili olmayan tek sayfa sürüklendiyse seçim bırakılmaz
  if (s.hedef == null) { ciz(); return; }
  const tasinan = g.pages.filter(p => s.keys.includes(p.key));
  const kalan = g.pages.filter(p => !s.keys.includes(p.key));
  const yeni = [...kalan.slice(0, s.hedef), ...tasinan, ...kalan.slice(s.hedef)];
  if (yeni.some((p, i) => p.key !== g.pages[i].key)) { izgaraKayit(g); g.pages = yeni; }
  ciz();
}

function satirSurukBasla() {
  const satir = $(`.mitem[data-k="${basili.key}"]`);
  satir.classList.add("lift");
  surukleme = { tur: "satir", key: basili.key, satir, y0: basili.y, hedef: null, sc: $("#mlist"), vy: 0 };
  surukleme.oto = setInterval(() => { if (surukleme && surukleme.vy) surukleme.sc.scrollTop += surukleme.vy; }, 16);
}
function satirSurukHareket(e) {
  const s = surukleme;
  s.satir.style.transform = `translateY(${e.clientY - s.y0}px)`;
  const sr = s.sc.getBoundingClientRect();
  s.vy = e.clientY < sr.top + 40 ? -10 : e.clientY > sr.bottom - 40 ? 10 : 0;
  const diger = $$(".mitem").filter(r => r.dataset.k !== s.key);
  let idx = 0;
  for (const r of diger) { const b = r.getBoundingClientRect(); if (e.clientY > b.top + b.height / 2) idx++; }
  s.hedef = idx;
  if (!diger.length) return;
  const ref = diger[Math.min(idx, diger.length - 1)].getBoundingClientRect();
  const y = idx < diger.length ? ref.top - 7 : ref.bottom + 5;
  Object.assign(ind.style, { display: "block", left: ref.left + "px", width: ref.width + "px", top: y + "px", height: "3px" });
}
function satirBirak(s) {
  const f = S.mg.files;
  if (s.hedef != null) {
    const tasinan = f.find(x => x.k === s.key);
    const kalan = f.filter(x => x.k !== s.key);
    kalan.splice(s.hedef, 0, tasinan);
    S.mg.files = kalan;
  }
  ciz();
}

/* ------------------------------------------------------------ büyük önizleme */
let pvSira = -1, pvG = null;
async function onizlemeAc(i, g = pvG || G()) {
  pvG = g;
  if (i < 0 || i >= g.pages.length) return;
  pvSira = i;
  const p = g.pages[i], bilgi = g.docs[p.doc].pages[p.idx];
  const k = p.doc + ":" + p.idx;
  $("#pv").classList.add("on");
  const st = $("#pvStage"), r = st.getBoundingClientRect();
  st.innerHTML = `<div class="paper" style="${kagitStil(bilgi.w, bilgi.h, p.rot, r.width || 800, r.height || 700)}"><img alt="" src="${BIG[k] || T[k] || ""}"></div>
    <div class="cap">${i + 1} / ${g.pages.length}</div>`;
  if (!BIG[k]) {
    try {
      BIG[k] = await api().buyuk_onizleme(p.doc, p.idx);
      if (pvSira === i) { const img = $("#pvStage img"); if (img) img.src = BIG[k]; }
    } catch (e) { /* küçük resimle devam */ }
  }
}
function onizlemeKapat() { $("#pv").classList.remove("on"); pvSira = -1; pvG = null; }
$("#pv").addEventListener("click", e => {
  const b = e.target.closest("[data-pv]");
  if (b) { const d = +b.dataset.pv; d ? onizlemeAc(pvSira + d) : onizlemeKapat(); return; }
  if (e.target.id === "pv") onizlemeKapat();
});
$("[data-pv='-1']").innerHTML = I.left; $("[data-pv='1']").innerHTML = I.right; $("[data-pv='0']").innerHTML = I.x;

/* ------------------------------------------------------------ klavye */
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  const ctrl = e.ctrlKey || e.metaKey, tus = e.key.toLowerCase();
  if ($("#pv").classList.contains("on")) {
    if (e.key === "Escape" || e.key === " ") { e.preventDefault(); onizlemeKapat(); }
    if (e.key === "ArrowRight") onizlemeAc(pvSira + 1);
    if (e.key === "ArrowLeft") onizlemeAc(pvSira - 1);
    return;
  }
  if (S.ekran === "text" && S.tx.info) {
    if (ctrl && tus === "z") { e.preventDefault(); txGeriAl(); }
    else if (ctrl && tus === "s") { e.preventDefault(); txKaydet(); }
    else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); txGit(S.tx.sayfa + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); txGit(S.tx.sayfa - 1); }
    else if (e.key === "Escape" && S.tx.ekle) { S.tx.ekle = false; ciz(); }
    return;
  }
  const st = aktifBelge();
  if (st) {
    if (ctrl && tus === "z") { e.preventDefault(); bgGeriAl(st); }
    else if (ctrl && tus === "a") { e.preventDefault(); st.sel = new Set(st.pages.map(p => p.key)); secimCiz(); }
    else if ((e.key === "Delete" || e.key === "Backspace") && st.sel.size) { e.preventDefault(); bgSil(st, new Set(st.sel)); }
    else if (e.key === "Escape" && st.sel.size) { st.sel.clear(); secimCiz(); }
    return;
  }
  if (S.ekran === "merge") {
    const g = aktifG();
    if (!g) return;
    if (ctrl && tus === "z") { e.preventDefault(); izgaraGeriAl(g); }
    else if (!g.sel.size) return;
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); sayfalariSil(new Set(g.sel), g); }
    else if (tus === "r" && !ctrl) seciliDondur();
    else if (e.key === "Escape") { g.sel.clear(); secimCiz(); }
    return;
  }
  if (!((S.ekran === "edit" || S.ekran === "img") && G().pages.length)) return;
  const g = G();
  if (ctrl && tus === "z") { e.preventDefault(); izgaraGeriAl(); }
  else if (ctrl && tus === "s") { e.preventDefault(); S.ekran === "img" ? imKaydet() : edKaydet(); }
  else if (ctrl && tus === "a") { e.preventDefault(); g.sel = new Set(g.pages.map(p => p.key)); secimCiz(); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); sayfalariSil(new Set(g.sel), g); }
  else if (tus === "r" && !ctrl) seciliDondur();
  else if (e.key === "Escape" && g.sel.size) { g.sel.clear(); secimCiz(); }
  else if (e.key === " " && g.sel.size) {
    e.preventDefault();
    onizlemeAc(g.pages.findIndex(p => g.sel.has(p.key)), g);
  }
});

/* ------------------------------------------------------------ başlangıç */
async function basla() {
  try { const a = await api().ayar_oku(); temaUygula((a && a.tema) || "sistem", false); } catch (e) { temaUygula("sistem", false); }
  document.documentElement.dataset.hazir = "1";
  try { S.son = await api().son_dosyalar(); } catch (e) { S.son = []; }
  ciz(true);
}
setTimeout(() => { document.documentElement.dataset.hazir = "1"; }, 700); // arka uç gecikirse de göster
if (window.pywebview && window.pywebview.api) basla();
else window.addEventListener("pywebviewready", basla);
ciz(true);
</script>
